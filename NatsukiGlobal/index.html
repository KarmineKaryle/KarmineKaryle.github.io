<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Natsuki Booper</title>
    <style>
        * { margin:0; padding:0; }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #ffffff;
        }
        #main-image {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            height: 100vh;
            width: auto;
            cursor: pointer;
            user-select: none;
            -webkit-user-drag: none;
        }
        .click-text {
            position: absolute;
            font-family: Arial, sans-serif;
            font-size: 28px;
            font-weight: bold;
            color: #000000;
            pointer-events: none;
            user-select: none;
            white-space: nowrap;
            text-shadow: 1px 1px 3px rgba(255, 255, 255, 0.9);
        }
        .toggle {
            appearance: none;
            width: 52px;
            height: 28px;
            background: #ccc;
            border-radius: 14px;
            position: relative;
            cursor: pointer;
            transition: .3s;
            outline: none;
            flex-shrink: 0;
        }
        .toggle::after {
            content: '';
            position: absolute;
            width: 24px;
            height: 24px;
            background: #fff;
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: .3s;
            box-shadow: 0 1px 3px rgba(0, 0, 0, .3);
        }
        .toggle:checked {
            background: #db73f0;
        }
        .toggle:checked::after {
            left: 26px;
        }

        .switch-group {
            display: flex;
            flex-direction: column;
            gap: 16px;             
            padding: 20px;
        }
        .switch-row {
            display: flex;
            align-items: center;
            gap: 12px;             
            font-family: sans-serif;
            cursor: pointer;
            user-select: none;
        }

    </style>

</head>
<body>


    <img id="main-image" src="natsukiIdle.png" alt="idle">
    <!-- <input type="checkbox" class="toggle" id="global_send_toggle">
    <input type="checkbox" class="toggle" id="global_recieve_toggle"> -->

    <div class="switch-group">
        <label class="switch-row">
            <input type="checkbox" class="toggle" id="global_send_toggle"> Global send
        </label>
        <label class="switch-row">
            <input type="checkbox" class="toggle" id="global_recieve_toggle"> Global recieve
        </label>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
			apiKey: atob("QUl6YVN5RHVpejlJUmUwYTBDTERyUDVSZV93WmFReUV5akpEa0ow"),
			authDomain: "natsukibooper.firebaseapp.com",
			databaseURL: "https://natsukibooper-default-rtdb.firebaseio.com",
			projectId: "natsukibooper",
			storageBucket: "natsukibooper.firebasestorage.app",
			messagingSenderId: "926971256823",
			appId: "1:926971256823:web:4ae9268d8338a0ca6718f2"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const boopsRef = db.ref('boops');

        const global_send_toggle = document.getElementById('global_send_toggle');
        const global_recieve_toggle = document.getElementById('global_recieve_toggle')

        // console.log(toggle.checked); 

        // toggle.addEventListener('change', () => {
        // if (toggle.checked) {
        //     console.log('ON');
        // } else {
        //     console.log('OFF');
        // }
        // });

        const sessionId = Math.random().toString(36).substring(2, 10) + Date.now().toString(36);

        const mainImage = document.getElementById('main-image');
        const personas = [
            'natsuki1.png',
            'natsuki2.png',
            'natsuki3.png',
            'natsuki4.png',
            'natsuki5.png'
        ];

        //Local
        function triggerBoopEffect() {
            clearTimeout(window._imageTimeout);
            const randomPersona = personas[Math.floor(Math.random() * personas.length)];
            mainImage.src = randomPersona;
            window._imageTimeout = setTimeout(() => {
                mainImage.src = 'natsukiIdle.png';
            }, 500);

            const clickText = document.createElement('div');
            clickText.className = 'click-text';
            clickText.innerText = '*boop*';

            const maxX = window.innerWidth - 120;
            const maxY = window.innerHeight - 50;
            const randomX = Math.max(10, Math.random() * maxX);
            const randomY = Math.max(10, Math.random() * maxY);

            clickText.style.left = randomX + 'px';
            clickText.style.top = randomY + 'px';
            clickText.style.transform = `rotate(${(Math.random()*60)-30}deg)`;

            document.body.appendChild(clickText);
            setTimeout(() => clickText.remove(), 500);
        }

        mainImage.addEventListener('click', () => {
            triggerBoopEffect();

            if (global_send_toggle.checked) {

                const newBoopRef = boopsRef.push({
                    timestamp: firebase.database.ServerValue.TIMESTAMP,
                    sessionId: sessionId
                });

                setTimeout(() => {
                    newBoopRef.remove().catch(err => console.warn('Boop already removed', err));
                }, 600);

            }
        });

        //Global
        boopsRef.limitToLast(1).on('child_added', (snapshot) => {
            const data = snapshot.val();

            if (data.sessionId === sessionId || !(global_recieve_toggle.checked) ) {
                return;
            }

            triggerBoopEffect();
            });

        setInterval(() => {
            const cutoff = Date.now() - 5000;
            boopsRef.orderByChild('timestamp')
                .endAt(cutoff)
                .once('value', (snapshot) => {
                    snapshot.forEach((child) => child.ref.remove());
                });
        }, 30000);
    </script>
</body>
</html>
