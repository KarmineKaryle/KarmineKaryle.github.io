<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N&Y Booper</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <link rel="preload" as="image" href="yuri666.png">
    <link rel="preload" as="image" href="yuriEasteregg.png">
    <link rel="preload" as="image" href="natsuki666.gif">
    <link rel="preload" as="image" href="natsuki666_2.gif">

    <div class="image-wrap" id="main-image-wrap">
        <img id="main-image" src="" alt="idle">
    </div>

    <div class="switch-group" id="switch-div">
        <label class="switch-row">
            <input type="checkbox" class="toggle" id="global_send_toggle"> Global send
        </label>
        <label class="switch-row">
            <input type="checkbox" class="toggle" id="global_recieve_toggle"> Global recieve
        </label>
        <label>
            <div class="select-fancy">
                <select name="Character" id="char" onchange="this.blur()">
                    <option value="natsuki">Natsuki</option>
                    <option value="yuri">Yuri</option>
                    <option value="sayori">Sayori</option>
                </select>
            </div>
        </label>
    </div>
    
    <div id="yuri_egg_2"></div>

    <div id="yuri_egg"></div>
    

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="scripts.js"></script>
</body>
</html>
